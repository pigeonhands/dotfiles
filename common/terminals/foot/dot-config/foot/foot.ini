# -*- conf -*-

[main]
font=JetBrainsMono NF:style=Regular:size=12
font-bold=JetBrainsMono NF:style=Bold:size=12
font-italic=JetBrainsMono NF:style=Italic:size=12
font-bold-italic=JetBrainsMono NF:style=Bold Italic:size=12
term=foot
pad=2x2
initial-window-size-chars=80x24

[csd]
preferred=none
border-width=0

[key-bindings]
spawn-terminal=Control+Shift+Return

[colors-dark]
foreground=c0caf5
background=1a1b26
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5
# Optional explicit cursor color overrides inside colors-dark if supported:
cursor=1a1b26 c0caf5

[cursor]
style=block
