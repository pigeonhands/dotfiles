[plugin_settings."noctalia/notes"]
panel_layer = "overlay"

[plugins]
enabled = [ "noctalia/kaomoji", "noctalia/notes", "noctalia/timer", "noctalia/screen_recorder" ]

[shell]
font_family = "JetBrainsMono NFM SemiBold"
polkit_agent = true

    [shell.animation]
    speed = 2.0500000305473804

    [shell.launcher]
    compact = true

        [shell.launcher.providers.panels]
        global = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/smc/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/smc/Pictures/Wallpapers/5554936.png"

    [wallpaper.last]
    path = "/home/smc/Pictures/Wallpapers/5554936.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/smc/Pictures/Wallpapers/5554936.png"

[widget.bar]
capsule = true
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%I:%M} {:%P}"

[widget.media]
hide_when_no_media = true

[widget.network_rx]
visualization = "graph"

[widget.network_tx]
visualization = "graph"

[widget.notes]
type = "noctalia/notes:notes"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.sysmon]
stat = "disk_used_pct"
visualization = "none"

[widget.tray]
drawer = true
pinned = [ "Fcitx", "KDE Connect Indicator", "tray-icon tray app" ]
